name: Build VCam Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Project Structure
        shell: python
        run: |
          import os, textwrap

          os.makedirs("app/src/main/java/com/vcam/studio", exist_ok=True)
          os.makedirs("app/src/main/java/de/robv/android/xposed/callbacks", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          def w(p, content):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          w("settings.gradle", """
              pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
              dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
              rootProject.name = 'VCamStudio'
              include ':app'
          """)

          w("build.gradle", """
              plugins {
                  id 'com.android.application' version '8.2.0' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
              }
          """)

          w("gradle.properties", """
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          w("app/build.gradle", """
              plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
              android {
                  namespace 'com.vcam.studio'
                  compileSdk 34
                  defaultConfig { applicationId 'com.vcam.studio'; minSdk 26; targetSdk 34; versionCode 1; versionName '4.2.0' }
                  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
                  kotlinOptions { jvmTarget = '17' }
              }
              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.activity:activity-ktx:1.8.2'
              }
          """)

          w("app/src/main/AndroidManifest.xml", """
              <?xml version='1.0' encoding='utf-8'?>
              <manifest xmlns:android='http://schemas.android.com/apk/res/android'>
                  <uses-permission android:name='android.permission.INTERNET' />
                  <uses-permission android:name='android.permission.READ_EXTERNAL_STORAGE' />
                  <uses-permission android:name='android.permission.WRITE_EXTERNAL_STORAGE' />
                  <application android:allowBackup='true' android:label='VCam Studio' android:usesCleartextTraffic='true' android:requestLegacyExternalStorage='true' android:theme='@android:style/Theme.DeviceDefault.NoActionBar'>
                      <meta-data android:name='xposedmodule' android:value='true' />
                      <meta-data android:name='xposeddescription' android:value='VCam Studio Controller' />
                      <meta-data android:name='xposedminversion' android:value='82' />
                      <activity android:name='.MainActivity' android:exported='true'>
                          <intent-filter>
                              <action android:name='android.intent.action.MAIN' />
                              <category android:name='android.intent.category.LAUNCHER' />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          w("app/src/main/assets/xposed_init", "com.vcam.studio.VCamHook\n")

          w("app/src/main/java/de/robv/android/xposed/callbacks/XC_LoadPackage.kt", """
              package de.robv.android.xposed.callbacks
              class XC_LoadPackage {
                  class LoadPackageParam {
                      @JvmField var packageName: String = ""
                      @JvmField var classLoader: ClassLoader? = null
                  }
              }
          """)

          w("app/src/main/java/de/robv/android/xposed/XposedStubs.kt", """
              package de.robv.android.xposed
              import de.robv.android.xposed.callbacks.XC_LoadPackage
              interface IXposedHookLoadPackage { fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) }
              abstract class XC_MethodHook {
                  class MethodHookParam { @JvmField var args: Array<Any?> = emptyArray() }
                  protected open fun beforeHookedMethod(param: MethodHookParam) {}
              }
              object XposedBridge { @JvmStatic fun log(text: String) {} }
              object XposedHelpers {
                  @JvmStatic fun findAndHookMethod(clazz: Class<*>, m: String, vararg p: Any?): Any? = null
                  @JvmStatic fun findAndHookMethod(c: String, cl: ClassLoader?, m: String, vararg p: Any?): Any? = null
              }
          """)

          w("app/src/main/java/com/vcam/studio/MainActivity.kt", """
              package com.vcam.studio
              import android.annotation.SuppressLint
              import android.app.Activity
              import android.content.Context
              import android.content.Intent
              import android.net.Uri
              import android.os.Bundle
              import android.webkit.JavascriptInterface
              import android.webkit.WebView
              import android.widget.Toast
              import androidx.activity.ComponentActivity
              import androidx.activity.result.contract.ActivityResultContracts
              import java.io.File
              import java.io.FileOutputStream
              class MainActivity : ComponentActivity() {
                  private val pickVideo = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                      if (res.resultCode == Activity.RESULT_OK) res.data?.data?.let { copyVideo(it) }
                  }
                  @SuppressLint("SetJavaScriptEnabled")
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      val wv = WebView(this)
                      wv.settings.javaScriptEnabled = true
                      wv.settings.domStorageEnabled = true
                      wv.addJavascriptInterface(Bridge(this), "AndroidBridge")
                      wv.loadUrl("file:///android_asset/index.html")
                      setContentView(wv)
                  }
                  private fun copyVideo(uri: Uri) {
                      try {
                          val dir = File("/sdcard/DCIM/Camera1")
                          if (!dir.exists()) dir.mkdirs()
                          contentResolver.openInputStream(uri)?.use { i -> FileOutputStream(File(dir, "virtual.mp4")).use { o -> i.copyTo(o) } }
                          Toast.makeText(this, "Video Ready!", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) { Toast.makeText(this, "Storage Permission Needed", Toast.LENGTH_LONG).show() }
                  }
                  inner class Bridge(private val ctx: Context) {
                      @JavascriptInterface fun setMasterEnabled(en: Boolean) { flag("disable.jpg", !en) }
                      @JavascriptInterface fun pickMedia() { pickVideo.launch(Intent(Intent.ACTION_GET_CONTENT).apply { type = "video/*" }) }
                      @JavascriptInterface fun setStreamUrl(u: String) { Toast.makeText(ctx, u, Toast.LENGTH_SHORT).show() }
                      @JavascriptInterface fun setRotation(d: Int) {}
                      @JavascriptInterface fun setMute(m: Boolean) { flag("no-silent.jpg", !m) }
                      @JavascriptInterface fun setFlip(f: Boolean) {}
                      @JavascriptInterface fun setPlaybackState(p: Boolean) {}
                      private fun flag(name: String, create: Boolean) {
                          try {
                              val d = File("/sdcard/DCIM/Camera1")
                              if (!d.exists()) d.mkdirs()
                              val f = File(d, name)
                              if (create && !f.exists()) f.createNewFile() else if (!create && f.exists()) f.delete()
                          } catch (_: Exception) {}
                      }
                  }
              }
          """)

          w("app/src/main/java/com/vcam/studio/VCamHook.kt", """
              package com.vcam.studio
              import android.graphics.SurfaceTexture
              import android.hardware.Camera
              import android.hardware.camera2.CameraCaptureSession
              import android.media.MediaPlayer
              import android.view.Surface
              import de.robv.android.xposed.*
              import de.robv.android.xposed.callbacks.XC_LoadPackage
              import java.io.File
              class VCamHook : IXposedHookLoadPackage {
                  private var mp: MediaPlayer? = null
                  override fun handleLoadPackage(lp: XC_LoadPackage.LoadPackageParam) {
                      if (lp.packageName == "com.vcam.studio") return
                      if (File("/sdcard/DCIM/Camera1/disable.jpg").exists()) return
                      val vf = File("/sdcard/DCIM/Camera1/virtual.mp4")
                      XposedHelpers.findAndHookMethod(Camera::class.java, "setPreviewTexture", SurfaceTexture::class.java, object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              if (!vf.exists()) return
                              val st = param.args[0] as? SurfaceTexture ?: return
                              play(Surface(st), vf.absolutePath)
                          }
                      })
                      XposedHelpers.findAndHookMethod("android.hardware.camera2.impl.CameraDeviceImpl", lp.classLoader, "createCaptureSession", List::class.java, CameraCaptureSession.StateCallback::class.java, android.os.Handler::class.java, object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              if (!vf.exists()) return
                              val list = param.args[0] as? List<*> ?: return
                              for (s in list) if (s is Surface) play(s, vf.absolutePath)
                          }
                      })
                  }
                  private fun play(s: Surface, path: String) {
                      try {
                          mp?.release()
                          mp = MediaPlayer().apply {
                              setSurface(s); setDataSource(path); isLooping = true
                              if (!File("/sdcard/DCIM/Camera1/no-silent.jpg").exists()) setVolume(0f, 0f)
                              prepare(); start()
                          }
                      } catch (e: Exception) { XposedBridge.log("Err") }
                  }
              }
          """)

          w("app/src/main/assets/index.html", """
              <!DOCTYPE html><html class='dark'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><script src='https://cdn.tailwindcss.com'></script><link href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined' rel='stylesheet'/></head>
              <body class='bg-[#131313] text-[#e5e2e1] p-4 flex flex-col gap-4 select-none font-sans'>
              <div class='flex justify-between items-center'><div><div class='text-lg font-bold'>VCam Studio</div><div class='text-xs text-gray-400'>Core Hook v4.2.0</div></div><div id='badge' class='px-3 py-1 rounded-full bg-[#2a2a2a] text-[#7dffa2] text-xs font-bold flex items-center gap-1.5'><span class='w-2 h-2 rounded-full bg-[#7dffa2] animate-ping'></span>Hook Active</div></div>
              <div class='rounded-xl bg-[#201f1f] p-4 flex justify-between items-center'><div><div class='font-semibold flex items-center gap-1.5'><span class='material-symbols-outlined text-[#7dffa2]'>cell_tower</span>Enable Virtual Camera</div><div class='text-xs text-gray-400 mt-0.5'>Intercepting HAL video pipes & camera sensors</div></div><button id='toggle' class='w-12 h-7 rounded-full bg-[#05e777]/40 p-1 flex items-center justify-end'><span id='thumb' class='w-5 h-5 rounded-full bg-[#7dffa2] block'></span></button></div>
              <div class='relative aspect-video rounded-xl bg-[#0e0e0e] overflow-hidden flex items-center justify-center border border-gray-800'><div class='absolute top-2 left-3 px-2 py-0.5 rounded-full bg-black/80 text-[#ffb4ab] text-[10px] font-bold'>● REC // LIVE</div><div class='absolute top-2 right-3 px-2 py-0.5 rounded bg-black/80 text-[#b0c6ff] text-[10px]'>1080p • 30fps • RAW</div><button id='play' class='w-12 h-12 rounded-full bg-[#2a2a2a]/80 flex items-center justify-center text-[#b0c6ff]'><span id='picon' class='material-symbols-outlined'>pause</span></button><div class='absolute bottom-2 inset-x-3 flex justify-between text-[10px] px-2 py-1 rounded bg-black/70 text-[#7dffa2]'><span>CH 1/2 VIRTUALIZED</span><span class='text-gray-300'>DELAY: 12ms</span></div></div>
              <div class='grid grid-cols-2 gap-2'><button id='pick' class='h-11 rounded-xl bg-[#558dff] text-[#002661] font-bold text-sm flex items-center justify-center gap-1.5'><span class='material-symbols-outlined text-[18px]'>folder_open</span>Select Video/Image</button><button id='stream' class='h-11 rounded-xl bg-[#2a2a2a] text-[#b0c6ff] font-bold text-sm flex items-center justify-center gap-1.5'><span class='material-symbols-outlined text-[18px]'>satellite_alt</span>Stream URL</button></div>
              <div class='text-xs text-gray-400 font-bold uppercase flex justify-between mt-1'><span>Real-time Adjustments</span><span class='text-[#7dffa2]'>4 Shaders Active</span></div>
              <div class='grid grid-cols-2 gap-2'>
              <button id='rot' class='p-3 h-24 rounded-xl bg-[#201f1f] flex flex-col justify-between text-left'><div class='flex justify-between w-full'><span class='material-symbols-outlined'>rotate_90_degrees_cw</span><span id='rval' class='text-xs px-1.5 py-0.5 rounded bg-[#353534]'>0°</span></div><div><div class='text-sm font-medium'>Rotate 90°</div><div class='text-[11px] text-gray-400'>Feed Orientation</div></div></button>
              <button id='flip' class='p-3 h-24 rounded-xl bg-[#201f1f] flex flex-col justify-between text-left'><div class='flex justify-between w-full'><span class='material-symbols-outlined'>flip</span><span id='fval' class='text-xs px-1.5 py-0.5 rounded bg-[#353534]'>OFF</span></div><div><div class='text-sm font-medium'>Flip Horizontal</div><div class='text-[11px] text-gray-400'>Mirror Inversion</div></div></button>
              <button class='p-3 h-24 rounded-xl bg-[#2a2a2a] border-t-2 border-[#7dffa2] flex flex-col justify-between text-left'><div class='flex justify-between w-full text-[#7dffa2]'><span class='material-symbols-outlined'>repeat</span><span class='text-[10px] px-1.5 py-0.5 rounded-full bg-[#7dffa2]/20 font-bold'>ON</span></div><div><div class='text-sm font-semibold text-[#7dffa2]'>Loop Video</div><div class='text-[11px] text-[#7dffa2]/80'>Infinite Buffer</div></div></button>
              <button id='mute' class='p-3 h-24 rounded-xl bg-[#201f1f] flex flex-col justify-between text-left'><div class='flex justify-between w-full'><span class='material-symbols-outlined'>volume_off</span><span id='mval' class='text-xs px-1.5 py-0.5 rounded bg-[#353534]'>OFF</span></div><div><div class='text-sm font-medium'>Mute Audio</div><div class='text-[11px] text-gray-400'>Virtual Mic Pipe</div></div></button>
              </div>
              <script>
              const B=window.AndroidBridge;let en=true,deg=0,fl=false,mu=false,pl=true;
              document.getElementById('toggle').onclick=()=>{en=!en;document.getElementById('toggle').className=en?'w-12 h-7 rounded-full bg-[#05e777]/40 p-1 flex items-center justify-end':'w-12 h-7 rounded-full bg-gray-700 p-1 flex items-center justify-start';B?.setMasterEnabled(en);};
              document.getElementById('pick').onclick=()=>B?.pickMedia();
              document.getElementById('stream').onclick=()=>{const u=prompt('Stream URL:','http://');if(u)B?.setStreamUrl(u);};
              document.getElementById('rot').onclick=()=>{deg=(deg+90)%360;document.getElementById('rval').textContent=deg+'°';B?.setRotation(deg);};
              document.getElementById('flip').onclick=()=>{fl=!fl;document.getElementById('fval').textContent=fl?'ON':'OFF';B?.setFlip(fl);};
              document.getElementById('mute').onclick=()=>{mu=!mu;document.getElementById('mval').textContent=mu?'ON':'OFF';B?.setMute(mu);};
              document.getElementById('play').onclick=()=>{pl=!pl;document.getElementById('picon').textContent=pl?'pause':'play_arrow';B?.setPlaybackState(pl);};
              </script></body></html>
          """)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK via SDK-less Compiler
        run: |
          yes | sdkmanager --licenses || true
          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: VCam-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
